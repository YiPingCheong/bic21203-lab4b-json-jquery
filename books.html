
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve and Display JSON Data</title>
</head>
<body>

    <h1>Question 2: Retrieve and Display JSON Data</h1>

    <h2>Book Information</h2>
    <p id="firstTitle"></p>
    <p id="secondAuthor"></p>

    <h2>Book Genres</h2>
    <div id="genres"></div>

    <p id="error" role="alert"></p>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Failed to load JSON file");
                }

                const data = await response.json();

                document.getElementById("firstTitle").textContent =
                    "First Book Title: " + data.books[0].title;

                document.getElementById("secondAuthor").textContent =
                    "Second Book Author: " + data.books[1].author;

                const genresDiv = document.getElementById("genres");

                data.books.forEach(function(book) {
                    const paragraph = document.createElement("p");
                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresDiv.appendChild(paragraph);
                });

            } catch (error) {
                document.getElementById("error").textContent =
                    "Unable to load book information. Please try again.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
